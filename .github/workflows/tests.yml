name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core backend dependencies
        run: |
          cd backend
          pip install fastapi uvicorn[standard] pydantic-settings sqlalchemy psycopg2-binary passlib python-jose[cryptography] email-validator python-dotenv loguru pytest pytest-asyncio httpx bcrypt

      - name: Run Pytest
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: test-secret-key-value-for-ci-actions-at-least-32-chars
          ENVIRONMENT: testing
          DEBUG: "false"
        run: |
          cd backend
          python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

